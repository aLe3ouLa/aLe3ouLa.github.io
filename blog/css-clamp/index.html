d><body><noscript><h1>Alexandra Barka — Frontend Engineer & Photographer</h1><p>I'm a Frontend Engineer based in Amsterdam, Netherlands, with a computer science background and working knowledge of UX design and web accessibility principles. I contributed to <a href="https://www.mews.com/">Mews</a>, <a href="https://www.spotify.com/">Spotify</a> and <a href="https://www.wbd.com/">Warner Bros. Discovery</a>.</p><p>I enjoy creating simple, clean and creative user interfaces using the latest web technologies.</p><h2>Skills & Tech Stack</h2><ul><li>JavaScript</li><li>React</li><li>TypeScript</li><li>CSS</li><li>UX Design</li><li>Web Accessibility</li></ul><h2>Experience</h2><ul><li>Frontend Engineer — Mews</li><li>Frontend Engineer — Spotify</li><li>Frontend Engineer — Warner Bros. Discovery</li></ul><h2>Writing & Photography</h2><p>As a hobby I write articles about web programming topics on <a href="https://dev.to/ale3oula">Dev.to</a> and share my photography on Instagram <a href="https://www.instagram.com/ale3oula/">@ale3oula</a>. I also offer professional photography booking services — see my <a href="https://ale3oula.github.io/photography">photography page</a>.</p><h2>Links</h2><ul><li><a href="https://github.com/ale3oula">GitHub</a></li><li><a href="https://dev.to/ale3oula">Dev.to</a></li><li><a href="https://www.instagram.com/ale3oula/">Instagram</a></li></ul></noscript><div id="root"><header class="sc-fqkvVR ifuDoY"><a href="/" style="text-decoration:none"><div class="sc-aXZVg bEHRlI"><div class="sc-gEvEer dihYOe logo-icon"></div><span class="sc-eqUAAy fFYkRh logo-text">alexandra</span></div></a><nav><ul class="sc-dcJsrY dUpKio"><li><a href="/blog">Blog</a></li><li><a href="/photography">Photography</a></li><li><a href="https://github.com/aLe3ouLa" rel="noopener noreferrer" target="_blank">GitHub</a></li><li><a href="https://www.instagram.com/ale3oula/" rel="noopener noreferrer" target="_blank">Instagram</a></li></ul></nav></header><main class="sc-jxOSlx caHGUc"><
